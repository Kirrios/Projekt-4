<html>  
    <body>
        
        <h3>Betalingsoplysninger</h3>
        <p>Hvor meget vil du donere?</p>
        
        <div class= "choose-a-donation-amount ">
            
            <button class="buttonsForDonations">25 kr</button>
            <button class="buttonsForDonations">50 kr</button>
            <button class="buttonsForDonations">100 kr</button>  
            <button class="buttonsForDonations">150 kr</button>
            <button class="buttonsForDonations">200 kr</button>
            <button class="buttonsForDonations">300 kr</button>
            <button class="buttonsForDonations">Resterende beløb</button>
        </div>
        
        <script>
            let container = document.querySelector(".choose-a-donation-amount");
            container.addEventListener("click", function(event){
                // console.log(event.target, event.target.parentNode.classList.contains("genstande-item"))
                // --- if clicked element contains the class "genstande-item": ---
                if (event.target.classList.contains("buttonsForDonations")) {
                    
                    // --- to do: remove class item-selected, from all other items ---
                    let list = document.querySelectorAll(".item-selected");
                    for (item of list){
                        item.classList.remove("item-selected");
                    };
                    
                    event.target.classList.add("item-selected");
                    console.log(event.target.innerText);
                };
            });
        </script>
    </body>
</html>
