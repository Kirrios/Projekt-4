<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tak for din donation - Mødrehjælpen</title>

    <!-- Skrifttype -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Ikoner -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../takgenstand.css" />
  </head>

  <body>
    <!-- HEADER / NAVIGATION -->
    <header>
      <nav class="navbar">
        <div class="nav-left">
          <button class="icon-button" aria-label="Åbn menu">
            <i class="fa-solid fa-bars"></i>
          </button>

          <button class="icon-button" aria-label="Søg">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>

        <!-- Mødrehjælpens logo -->
        <a href="index.html" class="logo" aria-label="Til forsiden">
          <img src="billeder/logo.png" alt="Mødrehjælpens logo" />
        </a>

        <div class="nav-right">
          <button class="icon-button" aria-label="Min profil">
            <i class="fa-regular fa-user"></i>
          </button>

          <a href="donationpenge.html" class="support-button"> Støt nu </a>
        </div>
      </nav>
    </header>

    <!-- TAKKESIDE -->
    <main class="tak-side">
      <section class="tak-kort">
        <!-- OVERSKRIFT -->
        <div class="tak-overskrift">
          <h1>Tusinde tak for din donation</h1>

          <p>
            Du har nu bidraget til, at et ønske, hos en familie og hos et barn,
            kunne gå i opfyldelse. Tak fordi du gør en forskel
          </p>
        </div>

        <!-- DONATIONSOVERSIGT -->
        <div class="tak-indhold">
          <h2>Din donation</h2>

          <div class="tak-produkt">
            <!-- VENSTRE: BILLEDE -->
            <div class="tak-billede-baggrund">
              <div class="tak-billede">
                <img
                  src="../genstand-donation/Billeder-til-doner-genstand/pink-shoes.png"
                  alt="sko til pige"
                />
              </div>
            </div>

            <!-- HØJRE: PRODUKTINFORMATION -->
            <div class="tak-produkt-info">
              <h3>Du har doneret:</h3>

              <div class="tak-produkt-navn">
                <span>Sko til pige</span>

                <i class="fa-regular fa-heart"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- KNAP NEDERST -->
        <div class="tak-bund">
          <a href="../genstand-donation/donation-genstand.html" class="nyt-oenske-knap" >
            Opfyld et nyt ønske

            <i class="fa-solid fa-arrow-right"></i>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
